repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in lockstep with the ruff version pyproject.toml resolves against
    # so pre-commit formatting does not drift from `uv run ruff format` (CI).
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-fast
        name: pytest (unit only)
        entry: uv run pytest -m "not integration" -x -q
        language: system
        pass_filenames: false
        always_run: true
