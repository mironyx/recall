version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # One PR per update type instead of one per package: separate PRs each go stale
    # against uv.lock as soon as any of them merges.
    groups:
      uv-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      uv-security-updates:
        applies-to: security-updates
        patterns: ["*"]
