[project]
name = "recall"
version = "0.1.0"
description = "Focused MCP memory server for coding agents (LangMem v2 successor)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Leonid" }]

dependencies = [
    # Pinned loosely; lock via uv.lock
    "mcp>=1.0",                       # MCP server SDK
    "langgraph>=0.2",                 # AsyncPostgresStore + namespace API
    "langgraph-checkpoint-postgres",  # Postgres backend for langgraph store
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "openai>=1.40",                   # embeddings (or compatible client)
    "pydantic>=2.7",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.7",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil",
    "pre-commit>=3.7",
]

[project.scripts]
recall = "recall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

# ---------------------------------------------------------------------------
# Ruff — lint + format in one tool
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "ASYNC",         # async lints
    "S",             # bandit (security)
]
ignore = [
    "S101",  # assert in tests is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: tests that hit a real Postgres via testcontainers",
]

[tool.coverage.run]
source = ["src/recall"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
