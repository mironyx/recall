services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: recall
      POSTGRES_DB: recall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall -d recall"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  recall:
    build: .
    environment:
      DATABASE_URL: postgresql://recall:recall@db:5432/recall
      RECALL_HOST: "0.0.0.0"
      RECALL_PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
